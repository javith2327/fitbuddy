<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitBuddy — AI Fitness Planner</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg"></div>
<main class="container">
  <section class="hero">
    <span class="badge">GEMINI AI • 7-DAY PLANNER</span>
    <h1>Fit<span>Buddy</span></h1>
    <p>Generate a personalized workout plan and a practical nutrition/recovery tip.</p>
  </section>

  <form class="card form-grid" action="/generate-workout" method="post">
    <label>Name
      <input name="username" required minlength="2" maxlength="100" placeholder="Your name">
    </label>
    <label>User ID
      <input name="user_id" required minlength="2" maxlength="80" placeholder="e.g. FB001">
    </label>
    <label>Age
      <input name="age" type="number" min="13" max="100" required>
    </label>
    <label>Weight (kg)
      <input name="weight" type="number" min="20" max="400" step="0.1" required>
    </label>
    <label>Fitness goal
      <input name="goal" required maxlength="100" placeholder="Muscle gain, weight loss, wellness...">
    </label>
    <label>Workout intensity
      <select name="intensity" required>
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
    </label>
    <button class="primary full" type="submit">Generate My 7-Day Plan →</button>
  </form>

  <p class="disclaimer">FitBuddy provides general educational fitness guidance, not medical diagnosis or treatment.</p>
  <nav><a href="/view-all-users">Admin / Coach Dashboard</a> · <a href="/docs">API Docs</a></nav>
</main>
</body>
</html>
